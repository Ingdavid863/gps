<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="vendor/maplibre-gl.css" />
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        html, body { background: #d9e2e8; font-family: system-ui, -apple-system, sans-serif; }
        #map { background: #d9e2e8; }
        .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { bottom: 128px; }
        .vehicle-wrap { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 2px 4px rgba(0,0,0,.48)); }
        .vehicle-arrow {
            width: 31px; height: 35px;
            background: #1677ff;
            clip-path: polygon(50% 0%, 89% 100%, 50% 78%, 11% 100%);
            border-radius: 3px;
        }
        #loading {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
            z-index: 20; min-width: 180px; max-width: 78vw; padding: 10px 14px; border-radius: 18px;
            background: rgba(255,255,255,.94); color: #243341; font-size: 13px; text-align: center;
            box-shadow: 0 3px 14px rgba(0,0,0,.22);
        }
        #loading.error { color: #9c2b24; font-weight: 600; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="loading">Iniciando motor GPS3D…</div>
<script src="vendor/maplibre-gl.js"></script>
<script>
(() => {
    const loading = document.getElementById('loading');
    const EMPTY = { type: 'FeatureCollection', features: [] };
    const TERRAIN_ID = 'gps-dem';
    const HILLSHADE_ID = 'gps-hillshade';
    const SATELLITE_ID = 'gps-satellite';
    const SATELLITE_LAYER = 'gps-satellite-layer';
    const BUILDING_SOURCE = 'gps-openfreemap';
    const BUILDINGS_ID = 'gps-3d-buildings';
    const HYBRID_ROADS_ID = 'gps-hybrid-roads';

    let ready = false;
    let setupFinished = false;
    let visuals = { is3D: true, terrain: true, buildings: true, satellite: false };
    let lastLocation = [-99.133209, 19.432608];
    let lastBearing = 0;

    function fail(message) {
        loading.textContent = message;
        loading.classList.add('error');
        loading.style.display = 'block';
        try {
            if (window.AndroidBridge && AndroidBridge.onMapError) AndroidBridge.onMapError(String(message));
        } catch (_) {}
    }

    if (typeof maplibregl === 'undefined') {
        fail('No se pudo iniciar el motor 3D local.');
        return;
    }

    if (maplibregl.supported && !maplibregl.supported()) {
        fail('El WebView de este teléfono no habilitó WebGL para el mapa 3D.');
        return;
    }

    const baseStyle = {
        version: 8,
        sources: {
            'gps-osm-base': {
                type: 'raster',
                tiles: [
                    'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
                    'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
                    'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
                ],
                tileSize: 256,
                maxzoom: 19,
                attribution: '© OpenStreetMap contributors'
            }
        },
        layers: [
            { id: 'gps-background', type: 'background', paint: { 'background-color': '#d9e2e8' } },
            { id: 'gps-osm-base-layer', type: 'raster', source: 'gps-osm-base', paint: { 'raster-opacity': 1.0 } }
        ]
    };

    let map;
    try {
        map = new maplibregl.Map({
            container: 'map',
            style: baseStyle,
            center: lastLocation,
            zoom: 16.8,
            pitch: 68,
            bearing: 0,
            maxPitch: 85,
            minZoom: 3,
            maxZoom: 20,
            attributionControl: true,
            canvasContextAttributes: { antialias: true },
            fadeDuration: 100
        });
    } catch (e) {
        fail('Error al crear el mapa 3D: ' + (e && e.message ? e.message : e));
        return;
    }

    map.touchZoomRotate.enable();
    map.dragRotate.enable();

    const vehicle = document.createElement('div');
    vehicle.className = 'vehicle-wrap';
    const arrow = document.createElement('div');
    arrow.className = 'vehicle-arrow';
    vehicle.appendChild(arrow);
    const vehicleMarker = new maplibregl.Marker({
        element: vehicle,
        rotationAlignment: 'map',
        pitchAlignment: 'map'
    }).setLngLat(lastLocation).addTo(map);

    function safeAddSource(id, spec) {
        if (!map.getSource(id)) {
            try { map.addSource(id, spec); } catch (e) { console.warn('source', id, e); }
        }
    }

    function safeAddLayer(layer, before) {
        if (!map.getLayer(layer.id)) {
            try { map.addLayer(layer, before); } catch (e) { console.warn('layer', layer.id, e); }
        }
    }

    function lineData(points) {
        if (!Array.isArray(points) || points.length < 2) return EMPTY;
        return { type: 'Feature', geometry: { type: 'LineString', coordinates: points }, properties: {} };
    }

    function pointData(points) {
        return {
            type: 'FeatureCollection',
            features: (Array.isArray(points) ? points : []).map(p => ({
                type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: p }
            }))
        };
    }

    function setLayerVisible(id, visible) {
        if (map.getLayer(id)) {
            try { map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none'); } catch (_) {}
        }
    }

    function applySky(enabled) {
        try {
            map.setSky(enabled ? {
                'sky-color': '#cfe4f5',
                'horizon-color': '#f6f3ec',
                'fog-color': '#e9edf0',
                'sky-horizon-blend': 0.68,
                'horizon-fog-blend': 0.38,
                'fog-ground-blend': 0.08
            } : undefined);
        } catch (_) {}
    }

    function applyVisuals() {
        if (!ready) return;
        const terrainActive = visuals.is3D && visuals.terrain && !!map.getSource(TERRAIN_ID);
        try {
            map.setTerrain(terrainActive ? { source: TERRAIN_ID, exaggeration: 1.12 } : null);
        } catch (e) { console.warn('terrain', e); }
        setLayerVisible(HILLSHADE_ID, visuals.terrain);
        setLayerVisible(BUILDINGS_ID, visuals.is3D && visuals.buildings);
        setLayerVisible(SATELLITE_LAYER, visuals.satellite);
        setLayerVisible(HYBRID_ROADS_ID, visuals.satellite);
        applySky(visuals.is3D);
        map.easeTo({ pitch: visuals.is3D ? 68 : 0, duration: 420, essential: true });
    }

    function setupCoreLayers() {
        // DEM source used by the official MapLibre terrain examples. Optional: a failure here
        // must never prevent the base map and navigation from loading.
        safeAddSource(TERRAIN_ID, {
            type: 'raster-dem',
            url: 'https://tiles.mapterhorn.com/tilejson.json',
            tileSize: 512,
            maxzoom: 14
        });

        safeAddLayer({
            id: HILLSHADE_ID,
            type: 'hillshade',
            source: TERRAIN_ID,
            paint: {
                'hillshade-exaggeration': 0.32,
                'hillshade-shadow-color': '#4c443b',
                'hillshade-highlight-color': '#fbf8ef',
                'hillshade-accent-color': '#7f776e'
            }
        });

        // Satellite and vector buildings are deliberately optional. If a provider is
        // temporarily unavailable, the OSM raster basemap continues working.
        safeAddSource(SATELLITE_ID, {
            type: 'raster',
            tiles: ['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'],
            tileSize: 256,
            maxzoom: 14,
            attribution: 'Satellite imagery © EOX Sentinel-2 cloudless'
        });
        safeAddLayer({
            id: SATELLITE_LAYER,
            type: 'raster',
            source: SATELLITE_ID,
            layout: { visibility: 'none' },
            paint: { 'raster-opacity': 0.94, 'raster-saturation': -0.08, 'raster-contrast': 0.08 }
        });

        safeAddSource(BUILDING_SOURCE, {
            type: 'vector',
            url: 'https://tiles.openfreemap.org/planet'
        });
        safeAddLayer({
            id: HYBRID_ROADS_ID,
            type: 'line',
            source: BUILDING_SOURCE,
            'source-layer': 'transportation',
            minzoom: 12,
            layout: { visibility: 'none', 'line-cap': 'round', 'line-join': 'round' },
            paint: {
                'line-color': '#ffffff',
                'line-opacity': 0.76,
                'line-width': ['interpolate', ['linear'], ['zoom'], 12, 0.8, 15, 2.0, 18, 5.0]
            }
        });
        safeAddLayer({
            id: BUILDINGS_ID,
            type: 'fill-extrusion',
            source: BUILDING_SOURCE,
            'source-layer': 'building',
            minzoom: 14,
            paint: {
                'fill-extrusion-color': [
                    'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 8],
                    0, '#dddcd8', 40, '#d2d6da', 120, '#c4ccd4', 260, '#b7c3ce'
                ],
                'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 8],
                'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
                'fill-extrusion-opacity': 0.95,
                'fill-extrusion-vertical-gradient': true
            }
        });

        safeAddSource('gps-route-alt-1', { type: 'geojson', data: EMPTY });
        safeAddSource('gps-route-alt-2', { type: 'geojson', data: EMPTY });
        safeAddSource('gps-route-active', { type: 'geojson', data: EMPTY });
        safeAddSource('gps-signals', { type: 'geojson', data: EMPTY });

        safeAddLayer({
            id: 'gps-route-alt-1-layer', type: 'line', source: 'gps-route-alt-1',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: { 'line-color': '#727d87', 'line-opacity': 0.72, 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 4, 18, 8] }
        });
        safeAddLayer({
            id: 'gps-route-alt-2-layer', type: 'line', source: 'gps-route-alt-2',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: { 'line-color': '#6e839b', 'line-opacity': 0.68, 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 4, 18, 8] }
        });
        safeAddLayer({
            id: 'gps-route-outline', type: 'line', source: 'gps-route-active',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: { 'line-color': '#ffffff', 'line-opacity': 0.98, 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 8, 18, 15] }
        });
        safeAddLayer({
            id: 'gps-route-active-layer', type: 'line', source: 'gps-route-active',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: { 'line-color': '#087cf0', 'line-opacity': 1.0, 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 5, 18, 11] }
        });
        safeAddLayer({
            id: 'gps-signals-layer', type: 'circle', source: 'gps-signals',
            paint: {
                'circle-radius': ['interpolate', ['linear'], ['zoom'], 12, 3.5, 18, 7],
                'circle-color': '#f5b400', 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 1.7
            }
        });
    }

    map.on('load', () => {
        // Declare the map ready BEFORE loading optional 3D providers. This prevents one
        // failing DEM/building service from producing an infinite black loading screen.
        ready = true;
        loading.textContent = 'Preparando relieve 3D…';
        try { setupCoreLayers(); } catch (e) { console.warn('optional 3D setup', e); }
        setupFinished = true;
        applyVisuals();
        loading.style.display = 'none';
        try { if (window.AndroidBridge && AndroidBridge.onMapReady) AndroidBridge.onMapReady(); } catch (_) {}
    });

    map.on('contextmenu', e => {
        try { if (window.AndroidBridge && AndroidBridge.routeTo) AndroidBridge.routeTo(e.lngLat.lat, e.lngLat.lng); } catch (_) {}
    });

    map.on('error', e => {
        const msg = e && e.error && e.error.message ? e.error.message : String(e && e.error ? e.error : e);
        console.warn('GPS3D map:', msg);
        // Once the base map is ready, tile/provider failures are non-fatal and should
        // never cover the entire UI with the loader again.
        if (!ready && msg) fail('No se pudo cargar el mapa base: ' + msg);
    });

    setTimeout(() => {
        if (!ready) fail('El mapa base tardó demasiado. Revisa Android System WebView y la conexión.');
    }, 15000);

    window.GPS3D = {
        setVisuals(is3D, terrain, buildings, satellite) {
            visuals = { is3D: !!is3D, terrain: !!terrain, buildings: !!buildings, satellite: !!satellite };
            applyVisuals();
        },
        setLocation(lon, lat, bearing) {
            lastLocation = [Number(lon), Number(lat)];
            lastBearing = Number(bearing) || 0;
            vehicleMarker.setLngLat(lastLocation);
            if (vehicleMarker.setRotation) vehicleMarker.setRotation(lastBearing);
        },
        setRoutes(active, alt1, alt2) {
            if (!ready) return;
            const a = map.getSource('gps-route-active');
            const b = map.getSource('gps-route-alt-1');
            const c = map.getSource('gps-route-alt-2');
            if (a) a.setData(lineData(active));
            if (b) b.setData(lineData(alt1));
            if (c) c.setData(lineData(alt2));
        },
        setSignals(points) {
            if (!ready) return;
            const s = map.getSource('gps-signals');
            if (s) s.setData(pointData(points));
        },
        follow(lon, lat, bearing, zoom, pitch, duration) {
            if (!ready) return;
            map.easeTo({
                center: [Number(lon), Number(lat)],
                bearing: Number(bearing) || 0,
                zoom: Number(zoom) || 17,
                pitch: Number(pitch) || 0,
                duration: Number(duration) || 650,
                essential: true
            });
        },
        reload() { location.reload(); }
    };
})();
</script>
</body>
</html>
