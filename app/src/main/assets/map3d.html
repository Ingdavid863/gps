<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="vendor/maplibre-gl.css" />
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        html, body { background: #d9e2e8; font-family: system-ui, -apple-system, sans-serif; }
        #map { background: #d9e2e8; }
        .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { bottom: 128px; }
        .vehicle-wrap { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 2px 4px rgba(0,0,0,.48)); }
        .vehicle-arrow {
            width: 31px; height: 35px;
            background: #19b45b;
            clip-path: polygon(50% 0%, 89% 100%, 50% 78%, 11% 100%);
            border-radius: 3px;
        }
        .destination-flag {
            width: 34px; height: 48px;
            display: flex; align-items: flex-start; justify-content: center;
            background: transparent; border: 0; box-shadow: none;
            font-size: 34px; line-height: 1;
            transform: translateY(2px) rotate(-3deg) perspective(120px) rotateY(-8deg);
            transform-origin: bottom center;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,.38));
            user-select: none; pointer-events: none;
        }
        .route-origin { width: 14px; height: 14px; border-radius:50%; background:#16834b; border:3px solid #fff; box-shadow:0 1px 5px #0006; }
        .selection-pin {
            width: 28px; height: 38px; position: relative;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,.35));
        }
        .selection-pin::before {
            content: '';
            position: absolute; left: 4px; top: 1px;
            width: 20px; height: 20px; border-radius: 50% 50% 50% 0;
            background: #d93025; border: 3px solid #fff;
            transform: rotate(-45deg);
            box-sizing: border-box;
        }
        .selection-pin::after {
            content: '';
            position: absolute; left: 11px; top: 8px;
            width: 6px; height: 6px; border-radius: 50%;
            background: #fff;
        }
        #loading {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
            z-index: 20; min-width: 180px; max-width: 78vw; padding: 10px 14px; border-radius: 18px;
            background: rgba(255,255,255,.94); color: #243341; font-size: 13px; text-align: center;
            box-shadow: 0 3px 14px rgba(0,0,0,.22);
        }
        #loading.error { color: #9c2b24; font-weight: 600; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="loading">Iniciando motor GPS3D…</div>
<script src="traffic-config.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="navigation-motion.js"></script>
<script src="navigation-view.js"></script>
<script src="navigation-styles.js"></script>
<script src="navigation-basemap.js"></script>
<script src="navigation-maneuvers.js"></script>
<script>
(() => {
    const loading = document.getElementById('loading');
    const EMPTY = { type: 'FeatureCollection', features: [] };
    const TERRAIN_ID = 'gps-dem';
    const HILLSHADE_ID = 'gps-hillshade';
    const SATELLITE_ID = 'gps-satellite';
    const SATELLITE_LAYER = 'gps-satellite-layer';
    const BUILDING_SOURCE = 'gps-openfreemap';
    const BUILDINGS_ID = 'gps-3d-buildings';
    const HYBRID_ROADS_ID = 'gps-hybrid-roads';
    const ROUTE_TRAFFIC_SOURCE_ID = 'gps-route-traffic';
    const ROUTE_TRAFFIC_LAYER_ID = 'gps-route-traffic-layer';
    const TRAFFIC_API_KEY = String((window.GPS3D_CONFIG && window.GPS3D_CONFIG.tomtomApiKey) || '').trim();

    let ready = false;
    let setupFinished = false;
    let trafficEnabled = true;
    let visuals = { is3D: false, terrain: false, buildings: false, satellite: false };
    let lastLocation = [-99.133209, 19.432608];
    let lastBearing = 0;
    let activeRoutePoints = [];
    let routeProgressStartIndex = 0;
    let routeTrafficIntervals = [];
    let routeTrafficGeneration = 0;
    let viewMode = 0;
    let viewportTop = 0.25, viewportBottom = 0.16;
    let remainingRoutePoints = [];
    let selectedPoint = null;
    let maneuverSteps = [], darkTheme = false, currentSeverity = '';
    let provider = TRAFFIC_API_KEY ? 'tomtom' : 'openfreemap';
    let appliedTheme = false, baseFailures = 0, viewportSignature = '';
    let networkAvailable = navigator.onLine;
    const resourceFailures = {};

    function currentPadding(overview = false) {
        return NavigationView.padding(map.getContainer().clientWidth, map.getContainer().clientHeight,
            viewportTop, viewportBottom, overview);
    }
    function showOverview() {
        if (!ready) return;
        cameraMotion = null;
        map.stop();
        // Android can deliver panel/layout changes before WebView's next render frame.
        // Re-measure before fitting and apply the overview atomically.
        map.resize();
        // Follow uses an asymmetric anchor. Clear its padding before fitting full-route bounds.
        map.jumpTo({pitch:0, bearing:0, padding:{top:0,bottom:0,left:0,right:0}});
        const points = NavigationView.overviewPoints(activeRoutePoints, lastLocation, selectedPoint);
        const options = { padding: currentPadding(true), pitch: 0, bearing: 0, duration: 0, essential: true };
        if (points.length < 2) {
            map.easeTo({ ...options, center: lastLocation, zoom: 14 });
        } else {
            const bounds = new maplibregl.LngLatBounds(points[0], points[0]);
            points.forEach(p => bounds.extend(p));
            map.fitBounds(bounds, { ...options, maxZoom: 17 });
        }
    }

    function fail(message) {
        loading.textContent = message;
        loading.classList.add('error');
        loading.style.display = 'block';
        try {
            if (window.AndroidBridge && AndroidBridge.onMapError) AndroidBridge.onMapError(String(message));
        } catch (_) {}
    }

    if (typeof maplibregl === 'undefined') {
        fail('No se pudo iniciar el motor 3D local.');
        return;
    }

    if (maplibregl.supported && !maplibregl.supported()) {
        fail('El WebView de este teléfono no habilitó WebGL para el mapa 3D.');
        return;
    }

    // Local vector styles can start immediately, even when individual tiles are offline.
    const baseStyle = NavigationBasemap.themedStyle(NavigationStyles, provider, false, TRAFFIC_API_KEY);

    let map;
    try {
        map = new maplibregl.Map({
            container: 'map',
            style: baseStyle,
            center: lastLocation,
            zoom: 17.4,
            pitch: 0,
            bearing: 0,
            maxPitch: 55,
            minZoom: 3,
            maxZoom: 19.3,
            attributionControl: true,
            canvasContextAttributes: { antialias: true },
            fadeDuration: 0,
            crossSourceCollisions: false,
            maxTileCacheSize: 320,
            maxTileCacheZoomLevels: 12,
            cancelPendingTileRequestsWhileZooming: false
        });
    } catch (e) {
        fail('Error al crear el mapa 3D: ' + (e && e.message ? e.message : e));
        return;
    }

    map.touchZoomRotate.enable();
    map.dragRotate.enable();

    const vehicle = document.createElement('div');
    vehicle.className = 'vehicle-wrap';
    const arrow = document.createElement('div');
    arrow.className = 'vehicle-arrow';
    vehicle.appendChild(arrow);
    const vehicleMarker = new maplibregl.Marker({
        element: vehicle,
        rotationAlignment: 'map',
        pitchAlignment: 'map'
    }).setLngLat(lastLocation).addTo(map);

    let displayedVehicle = lastLocation.slice();
    let targetVehicle = lastLocation.slice();
    let vehicleFrom = lastLocation.slice();
    let motionStarted = null, motionDuration = 250, vehicleSpeed = 0;
    let displayedBearing = 0, bearingFrom = 0;
    let cameraMotion = null, displayedCamera = null;
    let lastFixAt = null;
    function animateVehicleMarker(now) {
        if (motionStarted !== null) {
            const elapsed = now - motionStarted;
            const t = Math.min(1, elapsed / motionDuration);
            const predicted = NavigationMotion.advance(targetVehicle,
                Math.min(18, vehicleSpeed * Math.min(600, Math.max(0, elapsed)) / 1000),
                lastBearing, activeRoutePoints, routeProgressStartIndex);
            displayedVehicle = NavigationMotion.mix(vehicleFrom, predicted, t);
            displayedBearing = NavigationMotion.bearingMix(bearingFrom, lastBearing, t);
            vehicleMarker.setLngLat(displayedVehicle);
            if (vehicleMarker.setRotation) vehicleMarker.setRotation(displayedBearing);
        }
        if (ready && cameraMotion && viewMode !== 2) {
            const t = Math.min(1, (now - cameraMotion.at) / cameraMotion.duration);
            displayedCamera = NavigationMotion.mix(cameraMotion.from, cameraMotion.to, t);
            const delta = motionStarted === null ? [0, 0] : displayedVehicle.map((v, i) => v - targetVehicle[i]);
            const center = displayedCamera.slice(0, 2).map((v, i) => v + delta[i]);
            const bearing = NavigationMotion.bearingMix(cameraMotion.from[2], cameraMotion.to[2], t);
            const padding = currentPadding(), current = map.getCenter(), actualPadding = map.getPadding();
            // Repeating identical jumpTo calls every frame keeps the renderer permanently
            // moving and prevents cached zooms from settling. Only apply a real change.
            if (Math.abs(current.lng-center[0])>1e-8 || Math.abs(current.lat-center[1])>1e-8 ||
                Math.abs(map.getZoom()-displayedCamera[3])>1e-6 || Math.abs(map.getPitch()-displayedCamera[4])>1e-6 ||
                Math.abs(map.getBearing()-bearing)>1e-6 || Object.keys(padding).some(k=>Math.abs(actualPadding[k]-padding[k])>.01)) {
                map.jumpTo({center, bearing, zoom:displayedCamera[3], pitch:displayedCamera[4], padding});
            }
        }
        requestAnimationFrame(animateVehicleMarker);
    }
    requestAnimationFrame(animateVehicleMarker);
    window.addEventListener('resize', () => { if (ready && viewMode===2) showOverview(); });

    const destinationElement = document.createElement('div');
    destinationElement.className = 'destination-flag';
    destinationElement.textContent = '🏁';
    let destinationMarker = null;

    function setDestinationMarker(point) {
        if (destinationMarker) {
            destinationMarker.remove();
            destinationMarker = null;
        }
        if (!point || point.length < 2) return;
        destinationMarker = new maplibregl.Marker({
            element: destinationElement,
            anchor: 'bottom'
        }).setLngLat(point).addTo(map);
    }

    const selectionElement = document.createElement('div');
    selectionElement.className = 'selection-pin';
    let selectionMarker = null;

    function setSelectionMarker(point) {
        if (selectionMarker) {
            selectionMarker.remove();
            selectionMarker = null;
        }
        if (!point || point.length < 2) return;
        selectionMarker = new maplibregl.Marker({
            element: selectionElement,
            anchor: 'bottom'
        }).setLngLat(point).addTo(map);
    }

    function safeAddSource(id, spec) {
        if (!map.getSource(id)) {
            try { map.addSource(id, spec); } catch (e) { console.warn('source', id, e); }
        }
    }

    function safeAddLayer(layer, before) {
        if (!map.getLayer(layer.id)) {
            try { map.addLayer(layer, before); } catch (e) { console.warn('layer', layer.id, e); }
        }
    }

    function lineData(points) {
        if (!Array.isArray(points) || points.length < 2) return EMPTY;
        return { type: 'Feature', geometry: { type: 'LineString', coordinates: points }, properties: {} };
    }

    function pointData(points) {
        return {
            type: 'FeatureCollection',
            features: (Array.isArray(points) ? points : []).map(p => ({
                type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: p }
            }))
        };
    }

    function setLayerVisible(id, visible) {
        if (map.getLayer(id)) {
            try { map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none'); } catch (_) {}
        }
    }

    function applySky(enabled) {
        try {
            map.setSky(enabled ? {
                'sky-color': '#cfe4f5',
                'horizon-color': '#f6f3ec',
                'fog-color': '#e9edf0',
                'sky-horizon-blend': 0.68,
                'horizon-fog-blend': 0.38,
                'fog-ground-blend': 0.08
            } : undefined);
        } catch (_) {}
    }

    function applyVisuals() {
        if (!ready) return;
        const terrainActive = visuals.is3D && visuals.terrain && !!map.getSource(TERRAIN_ID);
        try {
            map.setTerrain(terrainActive ? { source: TERRAIN_ID, exaggeration: 1.0 } : null);
        } catch (e) { console.warn('terrain', e); }
        setLayerVisible(HILLSHADE_ID, visuals.terrain);
        setLayerVisible(BUILDINGS_ID, visuals.is3D && visuals.buildings);
        setLayerVisible(SATELLITE_LAYER, visuals.satellite);
        setLayerVisible(HYBRID_ROADS_ID, visuals.satellite);
        setLayerVisible(ROUTE_TRAFFIC_LAYER_ID, trafficEnabled && TRAFFIC_API_KEY.length > 0);
        applySky(visuals.is3D && !darkTheme);
        if (viewMode !== 2) map.easeTo({ pitch: viewMode === 1 ? 45 : 0, duration: 180, essential: true });
    }

    function applyTheme(dark) {
        darkTheme = !!dark;
        document.documentElement.style.background = darkTheme ? '#1c2430' : '#d9e2e8';
        map.getContainer().style.background = darkTheme ? '#1c2430' : '#d9e2e8';
        if (!ready) return;
        if (appliedTheme !== darkTheme) {
            appliedTheme = darkTheme;
            const themed = NavigationBasemap.themedStyle(NavigationStyles, provider, darkTheme, TRAFFIC_API_KEY);
            // Day and night have different layers, filters and label layouts. Painting
            // matching IDs alone leaves bright daytime land cover and missing night layers.
            // Rebuild GPU buckets on a theme change. Retaining daytime buckets can leave
            // cached lower zooms with labels but no road/fill geometry. Native HTTP assets
            // remain cached, so this also works offline without downloading them again.
            map.setStyle(NavigationBasemap.preserveNavigation(themed, map.getStyle()), {diff: false});
        }
        applySky(visuals.is3D && !darkTheme);
    }

    function prepareViewport() {
        if (!ready || !window.AndroidBridge || !AndroidBridge.prepareMapViewport) return;
        const bounds = map.getBounds(), z = Math.min(18, Math.floor(map.getZoom()));
        const n = 2 ** z;
        const signature = [z, ...[bounds.getWest(), bounds.getEast()].map(l => Math.floor((l + 180) / 360 * n)),
            ...[bounds.getSouth(), bounds.getNorth()].map(l => Math.floor((1 - Math.asinh(Math.tan(l * Math.PI / 180)) / Math.PI) / 2 * n))].join(':');
        if (signature === viewportSignature) return;
        viewportSignature = signature;
        AndroidBridge.prepareMapViewport(bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth(), map.getZoom());
    }
    setInterval(prepareViewport, 2000);
    function renderManeuvers() {
        const source=map.getSource('gps-maneuvers');
        if(source) source.setData(NavigationManeuvers.features(activeRoutePoints,maneuverSteps,routeProgressStartIndex,viewMode===2));
    }
    const originElement = document.createElement('div'); originElement.className='route-origin'; originElement.title='Inicio de la ruta';
    const originMarker = new maplibregl.Marker({element:originElement});
    function renderOrigin() {
        if(viewMode===2 && activeRoutePoints.length>1) originMarker.setLngLat(activeRoutePoints[0]).addTo(map); else originMarker.remove();
    }
    function notifyTraffic() {
        const severity = trafficEnabled ? NavigationManeuvers.severityAt(routeTrafficIntervals,routeProgressStartIndex) : 'normal';
        if (severity === currentSeverity) return;
        currentSeverity = severity;
        try { if(window.AndroidBridge && AndroidBridge.onTrafficSeverity) AndroidBridge.onTrafficSeverity(severity); } catch (_) {}
    }

    function distanceMeters(a, b) {
        const rad = Math.PI / 180;
        const lat1 = a[1] * rad;
        const lat2 = b[1] * rad;
        const dLat = (b[1] - a[1]) * rad;
        const dLon = (b[0] - a[0]) * rad;
        const h = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
        return 6371000 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
    }

    function sampledRouteIndices(points) {
        if (!Array.isArray(points) || points.length < 2) return [];
        let total = 0;
        for (let i = 1; i < points.length; i++) total += distanceMeters(points[i - 1], points[i]);
        const spacing = Math.max(550, total / 11);
        const out = [0];
        let since = 0;
        for (let i = 1; i < points.length - 1; i++) {
            since += distanceMeters(points[i - 1], points[i]);
            if (since >= spacing) {
                out.push(i);
                since = 0;
            }
        }
        if (out[out.length - 1] !== points.length - 1) out.push(points.length - 1);
        return out.slice(0, 13);
    }

    function trafficSeverity(data) {
        if (!data) return 'normal';
        if (data.roadClosure === true) return 'heavy';
        const current = Number(data.currentSpeed);
        const free = Number(data.freeFlowSpeed);
        const confidence = Number(data.confidence);
        if (!Number.isFinite(current) || !Number.isFinite(free) || free <= 1) return 'normal';
        if (Number.isFinite(confidence) && confidence < 0.25) return 'normal';
        const ratio = current / free;
        if (ratio < 0.35) return 'heavy';
        if (ratio < 0.58) return 'slow';
        if (ratio < 0.80) return 'moderate';
        return 'normal';
    }

    function renderRouteTraffic() {
        const source = map.getSource(ROUTE_TRAFFIC_SOURCE_ID);
        if (!source) return;
        if (!trafficEnabled || !TRAFFIC_API_KEY || activeRoutePoints.length < 2) {
            source.setData(EMPTY);
            return;
        }

        const features = [];
        for (const interval of routeTrafficIntervals) {
            if (interval.severity === 'normal') continue;
            const start = Math.max(viewMode===2?0:routeProgressStartIndex, interval.start);
            const end = Math.min(activeRoutePoints.length - 1, interval.end);
            if (end - start < 1) continue;
            features.push({
                type: 'Feature',
                properties: { severity: interval.severity },
                geometry: {
                    type: 'LineString',
                    coordinates: activeRoutePoints.slice(start, end + 1)
                }
            });
        }
        source.setData({ type: 'FeatureCollection', features });
        notifyTraffic();
    }

    async function refreshRouteTraffic() {
        const generation = ++routeTrafficGeneration;
        if (!trafficEnabled || !TRAFFIC_API_KEY || activeRoutePoints.length < 2) {
            routeTrafficIntervals = [];
            renderRouteTraffic();
            return;
        }

        const indices = sampledRouteIndices(activeRoutePoints);
        try {
            const samples = await Promise.all(indices.map(async index => {
                const p = activeRoutePoints[index];
                const url =
                    'https://api.tomtom.com/traffic/services/4/flowSegmentData/absolute/18/json' +
                    '?key=' + encodeURIComponent(TRAFFIC_API_KEY) +
                    '&point=' + encodeURIComponent(p[1] + ',' + p[0]) +
                    '&unit=kmph';
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) throw new Error('Traffic unavailable');
                const root = await response.json();
                return {
                    index,
                    severity: trafficSeverity(root && root.flowSegmentData)
                };
            }));

            if (generation !== routeTrafficGeneration) return;
            routeTrafficIntervals = samples.map((sample, i) => {
                const prev = samples[i - 1];
                const next = samples[i + 1];
                return {
                    start: prev ? Math.floor((prev.index + sample.index) / 2) : 0,
                    end: next ? Math.ceil((sample.index + next.index) / 2) : activeRoutePoints.length - 1,
                    severity: sample.severity
                };
            });
            renderRouteTraffic();
        } catch (e) {
            console.warn('route traffic', e);
        }
    }

    function setupCoreLayers() {
        // DEM source used by the official MapLibre terrain examples. Optional: a failure here
        // must never prevent the base map and navigation from loading.
        safeAddSource(TERRAIN_ID, {
            type: 'raster-dem',
            url: 'https://tiles.mapterhorn.com/tilejson.json',
            tileSize: 512,
            maxzoom: 14
        });

        safeAddLayer({
            id: HILLSHADE_ID,
            type: 'hillshade',
            source: TERRAIN_ID,
            paint: {
                'hillshade-exaggeration': 0.32,
                'hillshade-shadow-color': '#4c443b',
                'hillshade-highlight-color': '#fbf8ef',
                'hillshade-accent-color': '#7f776e'
            }
        });

        // Satellite and vector buildings are deliberately optional. If a provider is
        // temporarily unavailable, the OSM raster basemap continues working.
        safeAddSource(SATELLITE_ID, {
            type: 'raster',
            tiles: ['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'],
            tileSize: 256,
            maxzoom: 14,
            attribution: 'Satellite imagery © EOX Sentinel-2 cloudless'
        });
        safeAddLayer({
            id: SATELLITE_LAYER,
            type: 'raster',
            source: SATELLITE_ID,
            layout: { visibility: 'none' },
            paint: { 'raster-opacity': 0.94, 'raster-saturation': -0.08, 'raster-contrast': 0.08 }
        });

        safeAddSource(BUILDING_SOURCE, {
            type: 'vector',
            url: 'https://tiles.openfreemap.org/planet'
        });
        safeAddLayer({
            id: HYBRID_ROADS_ID,
            type: 'line',
            source: BUILDING_SOURCE,
            'source-layer': 'transportation',
            minzoom: 12,
            layout: { visibility: 'none', 'line-cap': 'round', 'line-join': 'round' },
            paint: {
                'line-color': '#ffffff',
                'line-opacity': 0.76,
                'line-width': ['interpolate', ['linear'], ['zoom'], 12, 0.8, 15, 2.0, 18, 5.0]
            }
        });
        safeAddLayer({
            id: BUILDINGS_ID,
            type: 'fill-extrusion',
            source: BUILDING_SOURCE,
            'source-layer': 'building',
            minzoom: 14,
            paint: {
                'fill-extrusion-color': [
                    'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 8],
                    0, '#dddcd8', 40, '#d2d6da', 120, '#c4ccd4', 260, '#b7c3ce'
                ],
                'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 8],
                'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
                'fill-extrusion-opacity': 0.95,
                'fill-extrusion-vertical-gradient': true
            }
        });

        safeAddSource('gps-route-alt-1', { type: 'geojson', data: EMPTY });
        safeAddSource('gps-route-alt-2', { type: 'geojson', data: EMPTY });
        safeAddSource('gps-route-active', { type: 'geojson', data: EMPTY });
        safeAddSource(ROUTE_TRAFFIC_SOURCE_ID, { type: 'geojson', data: EMPTY });
        safeAddSource('gps-tolls', { type: 'geojson', data: EMPTY });
        safeAddSource('gps-maneuvers', { type: 'geojson', data: EMPTY });

        safeAddLayer({
            id: 'gps-route-alt-1-layer', type: 'line', source: 'gps-route-alt-1',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: {
                'line-color': '#6f7a84',
                'line-opacity': 0.46,
                'line-width': ['interpolate', ['linear'], ['zoom'], 12, 3, 18, 6, 20, 7],
                'line-dasharray': [1.2, 1.5]
            }
        });
        safeAddLayer({
            id: 'gps-route-alt-2-layer', type: 'line', source: 'gps-route-alt-2',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: {
                'line-color': '#7b8792',
                'line-opacity': 0.42,
                'line-width': ['interpolate', ['linear'], ['zoom'], 12, 3, 18, 6, 20, 7],
                'line-dasharray': [1.2, 1.5]
            }
        });

        safeAddLayer({
            id: 'gps-route-shadow', type: 'line', source: 'gps-route-active',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: {
                'line-color': '#0a315c',
                'line-opacity': 0.42,
                'line-blur': 1.4,
                'line-width': ['interpolate', ['linear'], ['zoom'], 12, 11, 18, 17, 20, 21]
            }
        });
        safeAddLayer({
            id: 'gps-route-outline', type: 'line', source: 'gps-route-active',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: {
                'line-color': '#ffffff',
                'line-opacity': 0.98,
                'line-width': ['interpolate', ['linear'], ['zoom'], 12, 9, 18, 13, 20, 16]
            }
        });
        safeAddLayer({
            id: 'gps-route-active-layer', type: 'line', source: 'gps-route-active',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: {
                'line-color': '#087cf0',
                'line-opacity': 1.0,
                'line-width': ['interpolate', ['linear'], ['zoom'], 12, 5.5, 18, 8.5, 20, 10.5]
            }
        });
        safeAddLayer({
            id: ROUTE_TRAFFIC_LAYER_ID, type: 'line', source: ROUTE_TRAFFIC_SOURCE_ID,
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: {
                'line-color': [
                    'match', ['get', 'severity'],
                    'heavy', '#d93025',
                    'slow', '#f57c00',
                    'moderate', '#f9ab00',
                    '#087cf0'
                ],
                'line-opacity': 0.98,
                'line-width': ['interpolate', ['linear'], ['zoom'], 12, 5.5, 18, 8.5, 20, 10.5]
            }
        });

        safeAddLayer({
            id: 'gps-tolls-layer', type: 'circle', source: 'gps-tolls',
            paint: {
                'circle-radius': ['interpolate', ['linear'], ['zoom'], 12, 3.5, 18, 7],
                'circle-color': '#f5b400', 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 1.7
            }
        });
        safeAddLayer({id:'gps-maneuver-shafts',type:'line',source:'gps-maneuvers',filter:['==',['get','kind'],'shaft'],
            minzoom:14,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffffff','line-width':['interpolate',['linear'],['zoom'],14,2,18,4,19.3,5]}});
        safeAddLayer({id:'gps-maneuver-heads',type:'fill',source:'gps-maneuvers',filter:['==',['get','kind'],'head'],
            minzoom:14,paint:{'fill-color':'#ffffff'}});
    }

    map.on('style.load', () => {
        // Declare the map ready BEFORE loading optional 3D providers. This prevents one
        // failing DEM/building service from producing an infinite black loading screen.
        if (setupFinished) { applyVisuals(); renderManeuvers(); renderRouteTraffic(); return; }
        ready = true;
        loading.textContent = 'Preparando relieve 3D…';
        try { setupCoreLayers(); } catch (e) { console.warn('optional 3D setup', e); }
        setupFinished = true;
        applyVisuals();
        applyTheme(darkTheme);
        loading.style.display = 'none';
        try { if (window.AndroidBridge && AndroidBridge.onMapReady) AndroidBridge.onMapReady(); } catch (_) {}
        setTimeout(prepareViewport, 500);
    });

    NavigationMotion.installLongPress(map.getCanvas(), point => {
        const lngLat = map.unproject(point);
        try {
            if (window.AndroidBridge && AndroidBridge.previewDestination) {
                AndroidBridge.previewDestination(lngLat.lat, lngLat.lng);
            }
        } catch (_) {}
    }, () => { cameraMotion = null; });

    map.on('error', e => {
        const msg = e && e.error && e.error.message ? e.error.message : String(e && e.error ? e.error : e);
        console.warn('GPS3D map:', msg);
        if (e && e.sourceId) resourceFailures[e.sourceId] = (resourceFailures[e.sourceId] || 0) + 1;
        if (provider === 'tomtom' && e && e.sourceId === 'vectorTiles' && ++baseFailures >= 4 && networkAvailable &&
            map.queryRenderedFeatures().filter(f=>f.source==='vectorTiles').length === 0) {
            provider = 'openfreemap';
            const fallback = NavigationBasemap.themedStyle(NavigationStyles, provider, darkTheme, '');
            map.setStyle(NavigationBasemap.preserveNavigation(fallback, map.getStyle()), {diff:true});
        }
        // Once the base map is ready, tile/provider failures are non-fatal and should
        // never cover the entire UI with the loader again.
        // Tile failures do not block route geometry, cached resources or voice guidance.
    });

    setTimeout(() => {
        if (!ready) fail('El mapa base tardó demasiado. Revisa Android System WebView y la conexión.');
    }, 15000);

    setInterval(() => {
        if (ready && activeRoutePoints.length > 1 && trafficEnabled) refreshRouteTraffic();
    }, 60000);

    window.GPS3D = {
        setDarkTheme: applyTheme,
        setNetworkAvailable(available) {
            networkAvailable = !!available;
            if (!available || !ready) return;
            if (TRAFFIC_API_KEY && provider !== 'tomtom') {
                provider = 'tomtom'; baseFailures = 0;
                map.setStyle(NavigationBasemap.preserveNavigation(
                    NavigationBasemap.themedStyle(NavigationStyles, provider, darkTheme, TRAFFIC_API_KEY), map.getStyle()), {diff:true});
            }
            viewportSignature = '';
            if (map.refreshTiles) {
                const source = provider === 'tomtom' ? 'vectorTiles' : 'openmaptiles';
                if (map.getSource(source)) map.refreshTiles(source);
            }
            prepareViewport();
        },
        mapState() {
            const features=map.queryRenderedFeatures().filter(f=>f.source==='vectorTiles'||f.source==='openmaptiles');
            return {provider, dark:darkTheme, zoom:map.getZoom(), tilesLoaded:map.areTilesLoaded(),
                layerIds:map.getStyle().layers.map(l=>l.id), failures:{...resourceFailures},
                rendered:features.length, roads:features.filter(f=>f.layer.type==='line'&&/road/i.test(f.layer['source-layer']||'')).length,
                areas:features.filter(f=>f.layer.type==='fill').length};
        },
        setManeuvers(steps) { maneuverSteps=Array.isArray(steps)?steps:[]; renderManeuvers(); },
        setTrafficIntervals(intervals) { routeTrafficGeneration++; routeTrafficIntervals=Array.isArray(intervals)?intervals:[]; renderRouteTraffic(); },
        cameraState() { const c=map.getCenter(); return {ready:setupFinished,moving:map.isMoving(),width:map.getContainer().clientWidth,height:map.getContainer().clientHeight,mode:viewMode,pitch:map.getPitch(),center:[c.lng,c.lat],route:activeRoutePoints.map(p=>{const s=map.project(p);return [s.x,s.y]}),padding:currentPadding(true),dark:darkTheme}; },
        setVisuals(is3D, terrain, buildings, satellite) {
            visuals = { is3D: !!is3D, terrain: !!terrain, buildings: !!buildings, satellite: !!satellite };
            applyVisuals();
        },
        setTrafficEnabled(enabled) {
            trafficEnabled = !!enabled;
            setLayerVisible(ROUTE_TRAFFIC_LAYER_ID, trafficEnabled && TRAFFIC_API_KEY.length > 0);
            if (trafficEnabled) refreshRouteTraffic(); else renderRouteTraffic();
        },
        setLocation(lon, lat, bearing, speedMps) {
            const now = performance.now();
            lastLocation = [Number(lon), Number(lat)];
            vehicleFrom = displayedVehicle.slice();
            bearingFrom = displayedBearing;
            motionDuration = lastFixAt === null ? 250 : Math.max(100, Math.min(400, now - lastFixAt));
            if (lastFixAt === null || NavigationMotion.distance(vehicleFrom, lastLocation) > 150) {
                vehicleFrom = lastLocation.slice();
                displayedVehicle = lastLocation.slice();
            }
            targetVehicle = lastLocation.slice();
            vehicleSpeed = Math.max(0, Number(speedMps) || 0);
            lastBearing = Number(bearing) || 0;
            motionStarted = now;
            lastFixAt = now;
        },
        setRoutes(active, alt1, alt2) {
            if (!ready) return;
            activeRoutePoints = Array.isArray(active) ? active : [];
            remainingRoutePoints = activeRoutePoints;
            routeProgressStartIndex = 0;
            routeTrafficIntervals = [];
            currentSeverity = '';
            const a = map.getSource('gps-route-active');
            const b = map.getSource('gps-route-alt-1');
            const c = map.getSource('gps-route-alt-2');
            if (a) a.setData(lineData(activeRoutePoints));
            if (b) b.setData(lineData(alt1));
            if (c) c.setData(lineData(alt2));
            setDestinationMarker(activeRoutePoints.length ? activeRoutePoints[activeRoutePoints.length - 1] : null);
            renderManeuvers();
            renderOrigin();
            notifyTraffic();
            refreshRouteTraffic();
            if (viewMode === 2) showOverview();
        },
        setRouteProgress(lon, lat, fromIndex) {
            if (!ready || activeRoutePoints.length < 2) return;
            const source = map.getSource('gps-route-active');
            if (!source) return;
            const index = Math.max(0, Math.min(activeRoutePoints.length - 2, Number(fromIndex) || 0));
            routeProgressStartIndex = index;
            const remaining = [[Number(lon), Number(lat)], ...activeRoutePoints.slice(index + 1)];
            remainingRoutePoints = remaining;
            source.setData(lineData(viewMode === 2 ? activeRoutePoints : remaining));
            renderRouteTraffic();
            renderManeuvers();
            notifyTraffic();
        },
        setTolls(points) {
            if (!ready) return;
            const s = map.getSource('gps-tolls');
            if (s) s.setData(pointData(points));
        },
        setSelectionPin(lon, lat) {
            if (!ready) return;
            selectedPoint = [Number(lon), Number(lat)];
            setSelectionMarker([Number(lon), Number(lat)]);
        },
        clearSelectionPin() {
            selectedPoint = null;
            setSelectionMarker(null);
        },
        setViewport(top, bottom) {
            const nextTop = Math.max(0, Number(top) || 0), nextBottom = Math.max(0, Number(bottom) || 0);
            const changed = Math.abs(viewportTop-nextTop)>0.00001 || Math.abs(viewportBottom-nextBottom)>0.00001;
            viewportTop = nextTop;
            viewportBottom = nextBottom;
            const attribution = document.querySelectorAll('.maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right');
            attribution.forEach(el => { el.style.bottom = (viewportBottom * map.getContainer().clientHeight + 6) + 'px'; });
            if (viewMode === 2 && changed) showOverview();
        },
        setViewMode(mode) {
            const next = Math.max(0, Math.min(2, Number(mode) || 0));
            if (viewMode === next) return;
            viewMode = next;
            cameraMotion = null;
            map.stop();
            visuals.is3D = viewMode===1;
            applyVisuals();
            const source = map.getSource('gps-route-active');
            if (source) source.setData(lineData(viewMode === 2 ? activeRoutePoints : remainingRoutePoints));
            if (viewMode === 2) showOverview();
            renderRouteTraffic();
            renderManeuvers();
            renderOrigin();
        },
        showOverview,
        previewPoint(lon, lat) {
            cameraMotion = null;
            map.easeTo({center: [Number(lon), Number(lat)], zoom: 16.5, pitch: 0, bearing: 0,
                padding: currentPadding(true), duration: 300, essential: true});
        },
        follow(lon, lat, bearing, zoom, pitch, duration) {
            if (!ready || viewMode === 2) return;
            const center = map.getCenter();
            const from = [center.lng, center.lat, map.getBearing(), map.getZoom(), map.getPitch()];
            cameraMotion = {from, to: [Number(lon), Number(lat), Number(bearing) || 0,
                Number(zoom) || 17, Number(pitch) || 0], at: performance.now(),
                duration: Math.max(100, Math.min(400, motionDuration))};
        },
        reload() { location.reload(); }
    };
})();
</script>
</body>
</html>
