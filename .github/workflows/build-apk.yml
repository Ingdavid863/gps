name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, codex/gps3d-0.13.0, codex/gps3d-0.14.0 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore stable debug signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.gps3d/debug.keystore
          key: gps3d-debug-signing-v2
      - name: Prepare explicit signing key
        run: |
          mkdir -p "$HOME/.gps3d"
          if [ ! -s "$HOME/.gps3d/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.gps3d/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=GPS3D AR David, O=Android, C=MX" -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "GPS3D_DEBUG_KEYSTORE=$HOME/.gps3d/debug.keystore" >> "$GITHUB_ENV"
      - name: Persist signing key for future updates
        uses: actions/cache/save@v4
        with:
          path: ~/.gps3d/debug.keystore
          key: gps3d-debug-signing-v2
      - name: Validate live service credentials
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          test -n "$ARCORE_API_KEY" || { echo "ARCORE_API_KEY is missing"; exit 1; }
          test -n "$TOMTOM_API_KEY" || { echo "TOMTOM_API_KEY is missing"; exit 1; }
          echo "ARCore and TomTom credentials are configured."
      - name: Test navigation and build debug APK
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          node --test tests/*.test.cjs
          python -m unittest discover -s scripts -p 'test_*.py'
          gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Verify map rendering and camera modes
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          npm install --prefix "$RUNNER_TEMP/gps3d-qa" playwright@1.51.1 pngjs@7.0.0
          "$RUNNER_TEMP/gps3d-qa/node_modules/.bin/playwright" install --with-deps chromium
          GPS3D_QA_NODE_MODULES="$RUNNER_TEMP/gps3d-qa/node_modules" node tests/map-browser-qa.cjs
          GPS3D_QA_NODE_MODULES="$RUNNER_TEMP/gps3d-qa/node_modules" node tests/map-live-qa.cjs
          GPS3D_QA_NODE_MODULES="$RUNNER_TEMP/gps3d-qa/node_modules" node tests/traffic-live-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GPS3D-0.18-map-validation
          path: |
            build/map-qa/
            build/traffic-qa/
            app/build/ar-qa/
            app/build/signal-qa/
            app/build/test-results/testDebugUnitTest/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native map controls on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            GPS3D_AUTO_SHARE_QA=1 gradle :mapsFixture:assembleDebug --stacktrace
            adb install mapsFixture/build/outputs/apk/debug/mapsFixture-debug.apk
            bash scripts/run-android-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GPS3D-0.18-android-validation
          path: |
            build/native-map-qa/
            app/build/outputs/androidTest-results/connected/
      - name: Verify live signal data in Mexico
        env:
          GPS3D_SIGNAL_LIVE_QA: '1'
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          gradle testDebugUnitTest --tests '*SignalRepositoryTest' --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GPS3D-0.18-signal-validation
          path: |
            app/build/signal-qa/
            app/build/test-results/testDebugUnitTest/
      - name: Verify APK identity and update signature
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, shutil, subprocess
          apk = pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          sdk = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools' / '36.0.0'
          report = subprocess.check_output([str(sdk / 'apksigner'), 'verify', '--print-certs', str(apk)], text=True)
          certificate = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)', report).group(1)
          expected = 'afefdcd54dc7194464ef8dd4860ca09566100a12bbbc29acc05a3a4d4c81f620'
          assert certificate == expected, 'APK must preserve the installed 0.14 signing certificate'
          badging = subprocess.check_output([str(sdk / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          package = badging.splitlines()[0]
          assert "name='com.david.gps3dar'" in package and "versionCode='23'" in package and "versionName='0.18.0-beta-auto-routes'" in package, package
          assert re.search(r"sdkVersion:'26'", badging), 'Android minimum version must remain compatible'
          destination = pathlib.Path('build/delivery/GPS3D-AR-David-0.18.0-beta-auto-routes.apk')
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(apk, destination)
          print(package)
          print('APK signing certificate SHA256:', certificate)
          print('APK SHA256:', hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest())
          print('APK size:', apk.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GPS3D-AR-David-0.18.0-beta-auto-routes
          path: build/delivery/GPS3D-AR-David-0.18.0-beta-auto-routes.apk

