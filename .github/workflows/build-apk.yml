name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, codex/gps3d-0.13.0, codex/gps3d-0.14.0 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore stable debug signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.gps3d/debug.keystore
          key: gps3d-debug-signing-v2
      - name: Prepare explicit signing key
        run: |
          mkdir -p "$HOME/.gps3d"
          if [ ! -s "$HOME/.gps3d/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.gps3d/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=GPS3D AR David, O=Android, C=MX" -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "GPS3D_DEBUG_KEYSTORE=$HOME/.gps3d/debug.keystore" >> "$GITHUB_ENV"
      - name: Persist signing key for future updates
        uses: actions/cache/save@v4
        with:
          path: ~/.gps3d/debug.keystore
          key: gps3d-debug-signing-v2
      - name: Validate live service credentials
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          test -n "$ARCORE_API_KEY" || { echo "ARCORE_API_KEY is missing"; exit 1; }
          test -n "$TOMTOM_API_KEY" || { echo "TOMTOM_API_KEY is missing"; exit 1; }
          echo "ARCore and TomTom credentials are configured."
      - name: Test navigation and build debug APK
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          node --test tests/*.test.cjs
          python -m unittest discover -s scripts -p 'test_*.py'
          gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Verify map rendering and camera modes
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          npm install --prefix "$RUNNER_TEMP/gps3d-qa" playwright@1.51.1 pngjs@7.0.0
          "$RUNNER_TEMP/gps3d-qa/node_modules/.bin/playwright" install --with-deps chromium
          GPS3D_QA_NODE_MODULES="$RUNNER_TEMP/gps3d-qa/node_modules" node tests/map-browser-qa.cjs
          GPS3D_QA_NODE_MODULES="$RUNNER_TEMP/gps3d-qa/node_modules" node tests/map-live-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GPS3D-0.15-map-validation
          path: build/map-qa/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native map controls on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Download/GPS3DQA build/native-map-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GPS3D-0.15-android-validation
          path: build/native-map-qa/
      - uses: actions/upload-artifact@v4
        with:
          name: GPS3D-AR-David-0.15.0-beta-search-map
          path: app/build/outputs/apk/debug/app-debug.apk
