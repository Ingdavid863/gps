name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, codex/gps3d-0.13.0 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gps3d-debug-signing-v1
      - name: Validate live service credentials
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          test -n "$ARCORE_API_KEY" || { echo "ARCORE_API_KEY is missing"; exit 1; }
          test -n "$TOMTOM_API_KEY" || { echo "TOMTOM_API_KEY is missing"; exit 1; }
          echo "ARCore and TomTom credentials are configured."
      - name: Test navigation and build debug APK
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          node --test tests/*.test.cjs
          gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Verify map rendering and camera modes
        run: |
          npm install --prefix "$RUNNER_TEMP/gps3d-qa" playwright@1.51.1
          "$RUNNER_TEMP/gps3d-qa/node_modules/.bin/playwright" install --with-deps chromium
          GPS3D_QA_NODE_MODULES="$RUNNER_TEMP/gps3d-qa/node_modules" node tests/map-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: GPS3D-AR-David-0.13.0-beta-destinations
          path: app/build/outputs/apk/debug/app-debug.apk
