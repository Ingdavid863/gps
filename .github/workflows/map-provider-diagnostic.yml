name: Inspect destination vector detail
on:
  workflow_dispatch:
  pull_request:
    branches: [codex/gps3d-0.19.0-ar-continuity]
    paths: [".github/workflows/map-provider-diagnostic.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch a small destination sample without logging credentials
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          python3 - <<'PYCODE'
          import math, os, pathlib, urllib.request
          root=pathlib.Path('destination-vector-sample'); root.mkdir()
          lon,lat=-109.72339,23.1516
          for z in (16,17,18):
              n=2**z; x=math.floor((lon+180)/360*n); y=math.floor((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n)
              for dx in range(-1,2):
                  for dy in range(-1,2):
                      url=f'https://a.api.tomtom.com/map/1/tile/basic/main/{z}/{x+dx}/{y+dy}.pbf?key='+os.environ['TOMTOM_API_KEY']
                      with urllib.request.urlopen(url,timeout=15) as response: data=response.read()
                      (root/f'{z}_{x+dx}_{y+dy}.pbf').write_bytes(data)
              print('Destination level',z,'fetched')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: GPS3D-destination-vector-sample
          path: destination-vector-sample
          retention-days: 1
