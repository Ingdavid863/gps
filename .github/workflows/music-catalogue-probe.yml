name: Check native music catalogue access
on:
  workflow_dispatch:
  pull_request:
    branches: [codex/gps3d-0.19.0-ar-continuity]
    paths: ["scripts/music-catalogue-probe.mjs", "scripts/music-public-catalogue-probe.mjs", ".github/workflows/music-catalogue-probe.yml"]
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/gps3d-catalogue" youtubei.js@18.3.0 soundcloud-fetch@1.2.0
          cp scripts/music-catalogue-probe.mjs "$RUNNER_TEMP/gps3d-catalogue/probe.mjs"
          node "$RUNNER_TEMP/gps3d-catalogue/probe.mjs" || true
          cp scripts/music-public-catalogue-probe.mjs "$RUNNER_TEMP/gps3d-catalogue/public-probe.mjs"
          node "$RUNNER_TEMP/gps3d-catalogue/public-probe.mjs"
