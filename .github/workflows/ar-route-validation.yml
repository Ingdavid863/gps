name: Validate continuous walking AR
on:
  pull_request:
    branches: [codex/gps3d-0.14.0]
  workflow_dispatch:

jobs:
  ar-route:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          candidates = sorted(sdk.glob('cmdline-tools/*/bin/sdkmanager'))
          assert candidates, 'Android SDK manager is missing'
          subprocess.check_call([str(candidates[-1]), 'platforms;android-36', 'build-tools;36.0.0', 'platform-tools'])
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore the existing app signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.gps3d/debug.keystore
          key: gps3d-debug-signing-v2
      - name: Require the update-compatible signing key
        run: |
          test -s "$HOME/.gps3d/debug.keystore"
          echo "GPS3D_DEBUG_KEYSTORE=$HOME/.gps3d/debug.keystore" >> "$GITHUB_ENV"
      - name: Compile app and exercise route geometry and continuity
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          test -n "$ARCORE_API_KEY"
          test -n "$TOMTOM_API_KEY"
          gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Verify update identity
        run: |
          python3 - <<'PY'
          import os, pathlib, re, shutil, subprocess, hashlib
          apk = pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          certificate = subprocess.check_output([str(tools/'apksigner'), 'verify', '--print-certs', str(apk)], text=True)
          digest = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)', certificate).group(1)
          assert digest == 'afefdcd54dc7194464ef8dd4860ca09566100a12bbbc29acc05a3a4d4c81f620'
          package = subprocess.check_output([str(tools/'aapt'), 'dump', 'badging', str(apk)], text=True).splitlines()[0]
          assert "name='com.david.gps3dar'" in package and "versionCode='24'" in package and "versionName='0.19.0-beta-ar-continuity'" in package
          out = pathlib.Path('build/delivery/GPS3D-AR-David-0.19.0-beta-ar-continuity.apk')
          out.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(apk, out)
          print(package)
          print('Signature matches installed app:', digest)
          print('APK SHA256:', hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest())
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check real Android map handoff and destination HUD
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell svc power stayon true
            gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.david.gps3dar.WalkingHandoffTest,com.david.gps3dar.ArHudTest --stacktrace
            mkdir -p build/ar-native-qa
            adb pull /sdcard/Download/GPS3DARQA build/ar-native-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GPS3D-0.19-AR-validation
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/ar-qa/
            build/ar-native-qa/
      - uses: actions/upload-artifact@v4
        with:
          name: GPS3D-AR-David-0.19.0-beta-ar-continuity
          path: build/delivery/GPS3D-AR-David-0.19.0-beta-ar-continuity.apk
